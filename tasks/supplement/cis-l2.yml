# StigForge supplements for Ubuntu 24.04 CIS L2 - includes cis-l1 gaps plus L2-only login/PAM rules.

- name: StigForge supplement - set PASS_MAX_DAYS in /etc/login.defs (accounts_maximum_age_login_defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MAX_DAYS\s+'
    line: "PASS_MAX_DAYS   365"
    state: present
  tags:
    - accounts_maximum_age_login_defs

- name: StigForge supplement - set PASS_MIN_DAYS in /etc/login.defs (accounts_minimum_age_login_defs)
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MIN_DAYS\s+'
    line: "PASS_MIN_DAYS   1"
    state: present
  tags:
    - accounts_minimum_age_login_defs

- name: StigForge supplement - set INACTIVE in /etc/default/useradd (account_disable_post_pw_expiration)
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: '^\s*#?\s*INACTIVE='
    line: "INACTIVE=30"
    state: present
    create: true
  tags:
    - account_disable_post_pw_expiration

- name: StigForge supplement - ensure PAM runtime packages (CIS faillock/pwhistory prerequisites)
  ansible.builtin.apt:
    name:
      - libpam-runtime
      - libpam-modules
      - libpam-pwquality
    state: present
  tags:
    - accounts_passwords_pam_faillock_enabled
    - accounts_password_pam_pwhistory_enabled

- name: StigForge supplement - ensure /etc/security/faillock.conf exists
  ansible.builtin.file:
    path: /etc/security/faillock.conf
    state: touch
    mode: "0644"
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled
    - accounts_passwords_pam_faillock_deny
    - accounts_passwords_pam_faillock_unlock_time
    - accounts_passwords_pam_faillock_root_unlock_time

- name: StigForge supplement - set faillock deny (accounts_passwords_pam_faillock_deny)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*deny\s*='
    line: "deny = 3"
    state: present
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_deny

- name: StigForge supplement - set faillock unlock_time (accounts_passwords_pam_faillock_unlock_time)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*unlock_time\s*='
    line: "unlock_time = 900"
    state: present
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_unlock_time

- name: StigForge supplement - set faillock even_deny_root (accounts_passwords_pam_faillock_root_unlock_time)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*even_deny_root\s*='
    line: "even_deny_root"
    state: present
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_root_unlock_time

- name: StigForge supplement - pam-auth-update profile for pam_faillock authfail (accounts_passwords_pam_faillock_enabled)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Enable pam_faillock to deny access
      Default: yes
      Priority: 0
      Auth-Type: Primary
      Auth:
      	[default=die] pam_faillock.so authfail
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled

- name: StigForge supplement - pam-auth-update profile for pam_faillock preauth + account (accounts_passwords_pam_faillock_enabled)
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/faillock_notify
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: Notify of failed login attempts and reset count upon success
      Default: yes
      Priority: 1024
      Auth-Type: Primary
      Auth:
      	requisite pam_faillock.so preauth
      Account-Type: Primary
      Account:
      	required pam_faillock.so
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled

- name: StigForge supplement - remove the end-of-file authfail line an earlier supplement appended (accounts_passwords_pam_faillock_enabled)
  # Only a line OUTSIDE pam-auth-update's managed block is ours to remove; the managed one
  # is indented by pam-auth-update and sits between its "# here are the per-package modules"
  # markers. The old lineinfile wrote it flush-left at EOF, after pam_permit/pam_cap.
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^auth\s+\[default=die\]\s+pam_faillock\.so authfail\s*$'
    state: absent
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled

- name: StigForge supplement - remove the BOF preauth line an earlier supplement inserted (accounts_passwords_pam_faillock_enabled)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-auth
    regexp: '^auth\s+required\s+pam_faillock\.so preauth\s*$'
    state: absent
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled

- name: StigForge supplement - enable the faillock profiles with pam-auth-update (accounts_passwords_pam_faillock_enabled)
  ansible.builtin.command:
    cmd: pam-auth-update --package --enable faillock faillock_notify
  register: stigforge_pam_auth_update_faillock
  changed_when: stigforge_pam_auth_update_faillock.rc == 0
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_passwords_pam_faillock_enabled

- name: StigForge supplement - pam-auth-update profile for pam_pwhistory (accounts_password_pam_pwhistory_enabled)
  # CIS 5.3.3.3.1/.2: remember >= 24, enforce_for_root, use_authtok. A profile (Priority 1024, Primary) lets
  # pam-auth-update place the line BEFORE pam_unix in common-password. The task this replaces appended
  # `pam_pwhistory.so remember=5` at the END of the file, after pam_permit, where it never runs, and 5 is below
  # the profile's required 24 (ubuntu-24.04:cis-l1 2026-10-13: OVAL remember >= var_password_pam_remember = 24).
  ansible.builtin.copy:
    dest: /usr/share/pam-configs/pwhistory
    owner: root
    group: root
    mode: "0644"
    content: |
      Name: pwhistory password history checking
      Default: yes
      Priority: 1024
      Password-Type: Primary
      Password:
      	requisite pam_pwhistory.so remember={{ var_password_pam_remember | default('24') }} enforce_for_root try_first_pass use_authtok
      Password-Initial:
      	requisite pam_pwhistory.so remember={{ var_password_pam_remember | default('24') }} enforce_for_root try_first_pass
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_password_pam_pwhistory_enabled
    - accounts_password_pam_pwhistory_remember
    - accounts_password_pam_pwhistory_use_authtok
    - accounts_password_pam_pwhistory_enforce_root

- name: StigForge supplement - remove the end-of-file pwhistory line an earlier supplement appended (accounts_password_pam_pwhistory_enabled)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/common-password
    regexp: '^password\s+requisite\s+pam_pwhistory\.so remember=5 use_authtok enforce_for_root\s*$'
    state: absent
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_password_pam_pwhistory_enabled

- name: StigForge supplement - enable the pwhistory profile with pam-auth-update (accounts_password_pam_pwhistory_enabled)
  ansible.builtin.command:
    cmd: pam-auth-update --package --enable pwhistory
  register: stigforge_pam_auth_update_pwhistory
  changed_when: stigforge_pam_auth_update_pwhistory.rc == 0
  when: '"libpam-runtime" in ansible_facts.packages'
  tags:
    - accounts_password_pam_pwhistory_enabled
    - accounts_password_pam_pwhistory_remember

# ---- 2026-10-13 ubuntu-24.04:cis-l1 prove-out (OpenSCAP 95.0%, 15 non-exempt failures). Each task below is
# the real remediation for one rule the generated body did not satisfy; the ARF named the failing OVAL test.

# use_pam_wheel_group_for_su (CIS 5.3.7): su restricted to a dedicated group.
- name: Ensure the group used by pam_wheel for su exists
  ansible.builtin.group:
    name: sugroup
    state: present
  tags:
    - use_pam_wheel_group_for_su

- name: Restrict su to the sugroup group with pam_wheel (use_pam_wheel_group_for_su)
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^\s*auth\s+required\s+pam_wheel\.so'
    line: 'auth       required   pam_wheel.so use_uid group=sugroup'
    insertafter: '^#?\s*auth\s+required\s+pam_wheel\.so'
    state: present
  tags:
    - use_pam_wheel_group_for_su

# sshd_limit_user_access: deny root by name (the same conservative form proven on the EL cells; an
# AllowGroups list would lock out customer users).
- name: Limit sshd user access by denying root by name (sshd_limit_user_access)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*DenyUsers\s'
    line: 'DenyUsers root'
    insertbefore: '^\s*Match\s'
    firstmatch: true
    state: present
    validate: /usr/sbin/sshd -t -f %s
  tags:
    - sshd_limit_user_access

# sshd_use_strong_ciphers (CIS 5.1.6): an explicit Ciphers list of approved algorithms.
- name: Set the approved sshd Ciphers (sshd_use_strong_ciphers)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*Ciphers\s'
    line: 'Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr'
    insertbefore: '^\s*Match\s'
    firstmatch: true
    state: present
    validate: /usr/sbin/sshd -t -f %s
  tags:
    - sshd_use_strong_ciphers

# no_empty_passwords_unix: `nullok` lets an account with an empty password authenticate. It comes from the
# pam-auth-update `unix` profile, so remove it there too or the next pam-auth-update run puts it back.
- name: Remove nullok from the pam-auth-update unix profile (no_empty_passwords_unix)
  ansible.builtin.replace:
    path: /usr/share/pam-configs/unix
    regexp: '(pam_unix\.so[^\n]*?)[ \t]+nullok'
    replace: '\1'
  tags:
    - no_empty_passwords_unix

- name: Remove nullok from the generated PAM stacks (no_empty_passwords_unix)
  ansible.builtin.replace:
    path: '{{ item }}'
    regexp: '(pam_unix\.so[^\n]*?)[ \t]+nullok'
    replace: '\1'
  loop:
    - /etc/pam.d/common-auth
    - /etc/pam.d/common-password
    - /etc/pam.d/common-account
  tags:
    - no_empty_passwords_unix

# postfix_network_listening_disabled / has_nonlocal_mta: a local-only MTA must not listen on 0.0.0.0:25.
- name: Make postfix listen on loopback only (postfix_network_listening_disabled)
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: '^\s*inet_interfaces\s*='
    line: 'inet_interfaces = loopback-only'
    state: present
  register: stigforge_postfix_loopback
  when: '"postfix" in ansible_facts.packages'
  tags:
    - postfix_network_listening_disabled
    - has_nonlocal_mta

- name: Restart postfix so it stops listening on external interfaces (has_nonlocal_mta)
  ansible.builtin.service:
    name: postfix
    state: restarted
  when:
    - '"postfix" in ansible_facts.packages'
    - stigforge_postfix_loopback is changed
  tags:
    - postfix_network_listening_disabled
    - has_nonlocal_mta

# accounts_password_set_max_life_existing: existing accounts that already have a password carry the same
# maximum age as login.defs (PASS_MAX_DAYS 365 is set above, but useradd only applies it to NEW accounts).
- name: Set the maximum password age on existing accounts with a password (accounts_password_set_max_life_existing)
  ansible.builtin.shell:
    cmd: |
      for u in $(awk -F: -v max={{ var_accounts_maximum_age_login_defs | default('365') }} '$2 !~ /^[!*]/ && $2 != "" && $5 != max {print $1}' /etc/shadow); do
        chage --maxdays {{ var_accounts_maximum_age_login_defs | default('365') }} "$u" && echo "changed $u"
      done
    executable: /bin/bash
  register: stigforge_max_life
  changed_when: "'changed ' in stigforge_max_life.stdout"
  tags:
    - accounts_password_set_max_life_existing

# grub2_enable_apparmor (CIS 1.3.1.2): AppArmor is enabled on the kernel command line.
- name: Enable AppArmor on the kernel command line - apparmor=1 (grub2_enable_apparmor)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:[^"]*\s)?apparmor=1(?:\s|"))([^"]*)"$'
    line: '\1\2 apparmor=1"'
    backrefs: true
  register: stigforge_grub_apparmor1
  tags:
    - grub2_enable_apparmor

- name: Enable AppArmor on the kernel command line - security=apparmor (grub2_enable_apparmor)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:[^"]*\s)?security=apparmor(?:\s|"))([^"]*)"$'
    line: '\1\2 security=apparmor"'
    backrefs: true
  register: stigforge_grub_apparmor2
  tags:
    - grub2_enable_apparmor

- name: Regenerate the GRUB configuration after the AppArmor change (grub2_enable_apparmor)
  ansible.builtin.command: update-grub
  when: stigforge_grub_apparmor1 is changed or stigforge_grub_apparmor2 is changed
  changed_when: true
  tags:
    - grub2_enable_apparmor

# accounts_tmout (CIS 5.4.3.2): an idle-shell timeout defined in profile.d. The generated tasks only CORRECT an
# existing TMOUT and none existed, so the OVAL "TMOUT is defined" test was false (value 900 from the profile).
- name: Define a read-only TMOUT for login shells (accounts_tmout)
  ansible.builtin.copy:
    dest: /etc/profile.d/tmout.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # StigReady: terminate an idle login shell (accounts_tmout)
      TMOUT={{ var_accounts_tmout | default('900') }}
      readonly TMOUT
      export TMOUT
  tags:
    - accounts_tmout

# nftables_rules_permanent (CIS 4.3): /etc/nftables.conf must exist. The image carried no nftables at all
# (ubuntu-24.04:cis-l1 2026-10-13, OVAL test_etc_nftables_conf_file false). The package ships /etc/nftables.conf with an
# accept-all default; the default-deny ruleset written later in this supplement replaces it (owner 2026-10-19, "Meet it:
# drop-all + explicit allows", nftables_ensure_default_deny_policy), with inbound SSH kept open so the cloud user is never
# locked out.
- name: Install nftables so /etc/nftables.conf exists (nftables_rules_permanent)
  ansible.builtin.apt:
    name: nftables
    state: present
  tags:
    - nftables_rules_permanent

# auditd running and audit=1 on the kernel command line (stigready-hardened-controls, stigready-boot-cmdline-audit).
# CIS Ubuntu puts auditing at Level 2, so the cis-l1 role installs no auditd at all, yet the product requires every hardened
# image to boot with auditing on: the EC2 boot gate failed ubuntu-24.04:cis-l1 on both ("Service auditd is expected to be
# running", /proc/cmdline lacks audit=1; the build VM serial log shows audit_enabled=0). audit_backlog_limit is the CIS value.
- name: Install auditd (hardened images boot with auditing on)
  ansible.builtin.apt:
    name: auditd
    state: present
  tags:
    - package_auditd_installed

- name: Enable and start auditd
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  tags:
    - service_auditd_enabled

- name: Enable auditing from boot on the kernel command line - audit=1 (grub2_audit_argument)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:[^"]*\s)?audit=1(?:\s|"))([^"]*)"$'
    line: '\1\2 audit=1"'
    backrefs: true
  register: stigforge_grub_audit1
  tags:
    - grub2_audit_argument

- name: Set the audit backlog limit on the kernel command line - audit_backlog_limit=8192 (grub2_audit_backlog_limit_argument)
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=")(?!(?:[^"]*\s)?audit_backlog_limit=\d+(?:\s|"))([^"]*)"$'
    line: '\1\2 audit_backlog_limit=8192"'
    backrefs: true
  register: stigforge_grub_audit_backlog
  tags:
    - grub2_audit_backlog_limit_argument

- name: Regenerate the GRUB configuration after the audit change (grub2_audit_argument)
  ansible.builtin.command: update-grub
  when: stigforge_grub_audit1 is changed or stigforge_grub_audit_backlog is changed
  changed_when: true
  tags:
    - grub2_audit_argument

# root_path_all_dirs (CIS 5.4.2.5). Ubuntu's default PATH ends in /snap/bin; the minimal image has no snapd, so the
# directory does not exist and any user who could create it would hijack root's PATH (diagnostic on ubuntu-24.04:cis-l1
# 2026-10-13: "missing PATH dirs: ['/snap/bin']"). A root-owned empty directory removes the hijack without editing the
# several places Ubuntu defines that PATH (environment, login.defs, sudoers secure_path), which package updates restore.
- name: Create the root-owned /snap/bin that Ubuntu's default PATH names (root_path_all_dirs)
  ansible.builtin.file:
    path: /snap/bin
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - root_path_all_dirs

# all_apparmor_profiles_in_enforce_complain_mode (CIS 1.3.1.3/1.3.1.4). The diagnostic showed 116 loaded profiles, 25 in
# enforce or complain and 91 in unconfined mode. Those 91 are Ubuntu 24.04's flags=(unconfined) user-namespace profiles for
# applications that are not installed. Enforcing them would confine (and break) an application a customer installs later;
# complain mode is the same effective behaviour (log, do not deny) and satisfies the rule. Profiles already enforcing stay so.
- name: Find AppArmor profile files that are flagged unconfined
  ansible.builtin.find:
    paths: /etc/apparmor.d
    file_type: file
    recurse: false
    contains: '.*flags=\([^)]*\bunconfined\b[^)]*\)'   # ansible find matches each line with re.match, so anchor-free text needs the .* prefix
  register: stigforge_apparmor_unconfined
  tags:
    - all_apparmor_profiles_in_enforce_complain_mode

- name: Put unconfined AppArmor profiles in complain mode (all_apparmor_profiles_in_enforce_complain_mode)
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '(flags=\([^)]*?)\bunconfined\b'
    replace: '\1complain'
  loop: '{{ stigforge_apparmor_unconfined.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  register: stigforge_apparmor_complain
  tags:
    - all_apparmor_profiles_in_enforce_complain_mode

- name: Reload AppArmor so the complain flags take effect (all_apparmor_profiles_in_enforce_complain_mode)
  ansible.builtin.service:
    name: apparmor
    state: reloaded
  when: stigforge_apparmor_complain is changed
  tags:
    - all_apparmor_profiles_in_enforce_complain_mode

- name: Unload unconfined AppArmor profiles that have no definition on disk (all_apparmor_profiles_in_enforce_complain_mode)
  ansible.builtin.shell: |
    set -eu
    list=/sys/kernel/security/apparmor/profiles
    [ -r "$list" ] || exit 0
    removed=""
    while IFS= read -r line; do
      name="${line% (unconfined)}"
      [ "$name" != "$line" ] || continue
      if grep -rqsF -e "profile $name " -e "profile $name{" -e "profile \"$name\"" /etc/apparmor.d /var/lib/snapd/apparmor/profiles; then
        continue
      fi
      printf '%s' "$name" > /sys/kernel/security/apparmor/.remove
      removed="$removed $name"
    done < "$list"
    [ -z "$removed" ] || echo "removed:$removed"
  args:
    executable: /bin/bash
  register: stigforge_apparmor_unloaded
  changed_when: "'removed:' in stigforge_apparmor_unloaded.stdout"
  tags:
    - all_apparmor_profiles_in_enforce_complain_mode

# nftables_rules_permanent (CIS 4.3.x). The OVAL needs /etc/nftables.conf to exist AND to carry an include "<file>" entry whose
# file exists (ubuntu-24.04:cis-l2 2026-10-14: test_etc_nftables_conf_file and ..._include_file_exists both false). The conf
# flushes and includes /etc/nftables.rules. The stock accept-all table below is only the first-write placeholder (force: false);
# with nftables_ensure_default_deny_policy on (the default) the default-deny ruleset after the conf task replaces it.
- name: Write /etc/nftables.rules with the stock accept-all table (nftables_rules_permanent)
  ansible.builtin.copy:
    dest: /etc/nftables.rules
    owner: root
    group: root
    mode: "0640"
    force: false
    content: |
      table inet filter {
      	chain input {
      		type filter hook input priority filter;
      	}
      	chain forward {
      		type filter hook forward priority filter;
      	}
      	chain output {
      		type filter hook output priority filter;
      	}
      }
  tags:
    - nftables_rules_permanent

- name: Write /etc/nftables.conf to include /etc/nftables.rules (nftables_rules_permanent)
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/usr/sbin/nft -f

      flush ruleset

      include "/etc/nftables.rules"
  tags:
    - nftables_rules_permanent

# ---- 2026-10-13 ubuntu-24.04:cis-l2 prove-out (OpenSCAP 96.3%, 12 non-exempt failures, 12 regressions). Values are the
# profile's own (ARF set-value): disk_full halt, disk_error syslog, space_left email, admin_space_left halt, keep_logs.

# auditd_data_* (CIS 6.3.2.x). A halted instance can be restarted and inspected from the EC2 console; single-user mode on a
# cloud instance with no console would be unreachable, so halt is used where the profile offers halt|single.
# The two actions that stop the host read the SSG variable names the EL roles already expose, so a customer who chooses availability
# over the benchmark can set them (README "Before you run this role"). The defaults are the profile's values; anything other than
# halt|single (disk_full) or halt (admin_space_left) fails the CIS rule. `.split('|')[0]` keeps a profile-style "a|b" value valid.
- name: Configure auditd.conf actions and retention (auditd_data_*)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*#?\s*{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
  loop:
    - {key: disk_full_action, value: "{{ (var_auditd_disk_full_action | default('halt')).split('|')[0] }}"}
    - {key: disk_error_action, value: syslog}
    - {key: space_left_action, value: email}
    - {key: admin_space_left_action, value: "{{ (var_auditd_admin_space_left_action | default('halt')).split('|')[0] }}"}
    - {key: max_log_file_action, value: keep_logs}
    - {key: action_mail_acct, value: root}
  loop_control:
    label: '{{ item.key }}'
  tags:
    - auditd_data_disk_full_action
    - auditd_data_disk_error_action
    - auditd_data_retention_space_left_action
    - auditd_data_retention_admin_space_left_action
    - auditd_data_retention_max_log_file_action

# file_group_ownership_var_log_audit: the OVAL XORs "audit log files are group root" with "auditd.conf log_group is not
# root"; Ubuntu's default log_group = adm makes both true and the rule false.
- name: Set auditd log_group to root (file_group_ownership_var_log_audit)
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*#?\s*log_group\s*='
    line: 'log_group = root'
  register: stigforge_audit_log_group
  tags:
    - file_group_ownership_var_log_audit
    - file_permissions_var_log_audit

# audit_rules_session_events / audit_rules_networkconfig_modification (CIS 6.3.3.x). SSG's OVAL requires the arch=b32 syscall rule
# on every architecture. It was once written on x86_64 only, on the belief that arch=b32 fails augenrules elsewhere; on Ubuntu 24.04
# arm64 (kernel 6.8, CONFIG_COMPAT=y) auditd maps b32 to the arm table and the rule loads (augenrules rc=0, listed by auditctl -l;
# tested 2026-10-20), and ubuntu-24.04-arm64:cis-l2 failed the gate without it.
- name: Audit rules for session events and network environment changes
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-stigready-session-network.rules
    owner: root
    group: root
    mode: "0600"
    content: |
      -w /var/run/utmp -p wa -k session
      -w /var/log/wtmp -p wa -k session
      -w /var/log/btmp -p wa -k session
      -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/networks -p wa -k system-locale
      -w /etc/network/ -p wa -k system-locale
      -w /etc/netplan/ -p wa -k system-locale
  register: stigforge_audit_rules_session_network
  tags:
    - audit_rules_session_events
    - audit_rules_networkconfig_modification

- name: Load the audit rules (audit_rules_session_events)
  ansible.builtin.command: augenrules --load
  when: stigforge_audit_rules_session_network is changed
  changed_when: true
  tags:
    - audit_rules_session_events
    - audit_rules_networkconfig_modification

# accounts_passwords_pam_faillock_root_unlock_time: the profile value is 60 seconds.
- name: Set the faillock root unlock time (accounts_passwords_pam_faillock_root_unlock_time)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^\s*#?\s*root_unlock_time\s*='
    line: 'root_unlock_time = {{ var_accounts_passwords_pam_faillock_root_unlock_time | default("60") }}'
    create: true
    owner: root
    group: root
    mode: "0644"
  tags:
    - accounts_passwords_pam_faillock_root_unlock_time

# directory_permissions_var_log_audit / file_permissions_var_log_audit / file_group_ownership_var_log_audit /
# file_permissions_etc_audit_rulesd. With log_group = root the OVAL expects /var/log/audit 0700 and its logs 0600, all root:root;
# changing auditd.conf does not re-own what auditd already created as root:adm 0750/0640 (ubuntu-24.04:cis-l2 2026-10-14:
# the four rules regressed after log_group was set). /etc/audit/rules.d files must be 0600 or stricter (the OVAL object excludes
# only files in state mode_0600or_stricter, so a 0640 rules file fails the rule).
#
# auditd reads log_group only when it starts. The daemon is already running with Ubuntu's default (adm) when this file is edited,
# so the first rotation (max_log_file = 8 MB, reached during the build) created a new audit.log as root:adm 0640 AFTER the
# permission tasks below had run (ubuntu-24.04:cis-l2 2026-10-14: audit.log gid 4, 0640 in the final scan). Restart auditd first
# so every file it creates from now on is root:root 0600, then normalise what already exists.
- name: Restart auditd so it creates logs with the new log_group (file_group_ownership_var_log_audit)
  ansible.builtin.service:
    name: auditd
    state: restarted
  when: stigforge_audit_log_group is changed
  tags:
    - file_group_ownership_var_log_audit
    - file_permissions_var_log_audit

- name: Make /var/log/audit private to root (directory_permissions_var_log_audit)
  ansible.builtin.file:
    path: /var/log/audit
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags:
    - directory_permissions_var_log_audit
    - file_group_ownership_var_log_audit

- name: Find the audit log files
  ansible.builtin.find:
    paths: /var/log/audit
    patterns: 'audit.log*'
    file_type: file
  register: stigforge_audit_logs
  tags:
    - file_permissions_var_log_audit
    - file_group_ownership_var_log_audit

- name: Make the audit log files root:root 0600 (file_permissions_var_log_audit)
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
    group: root
    mode: "0600"
  loop: '{{ stigforge_audit_logs.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
    - file_permissions_var_log_audit
    - file_group_ownership_var_log_audit

- name: Make /etc/audit/rules.d root-owned 0750 (file_permissions_etc_audit_rulesd)
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - file_permissions_etc_audit_rulesd

- name: Find the audit rules files
  ansible.builtin.find:
    paths: /etc/audit/rules.d
    patterns: '*.rules'
    file_type: file
  register: stigforge_audit_rules_files
  tags:
    - file_permissions_etc_audit_rulesd

- name: Make the audit rules files root:root 0600 (file_permissions_etc_audit_rulesd)
  ansible.builtin.file:
    path: '{{ item.path }}'
    owner: root
    group: root
    mode: "0600"
  loop: '{{ stigforge_audit_rules_files.files | default([]) }}'
  loop_control:
    label: '{{ item.path }}'
  tags:
    - file_permissions_etc_audit_rulesd

- name: Write /etc/nftables.rules with the default-deny ruleset (nftables_ensure_default_deny_policy)
  ansible.builtin.copy:
    dest: /etc/nftables.rules
    owner: root
    group: root
    mode: "0640"
    content: |
      # StigReady default-deny host firewall (nftables_ensure_default_deny_policy).
      # All three base chains drop; only the traffic allowed below passes. Add your own service ports here.
      table inet filter {
      	chain input {
      		type filter hook input priority filter; policy drop;
      		# Loopback (set_nftables_loopback_traffic): lo traffic passes, loopback source addresses arriving on any
      		# other interface are spoofed and dropped. Kept first: the SSG check reads this chain only up to the first "}".
      		iif "lo" accept
      		ip saddr 127.0.0.0/8 counter drop
      		ip6 saddr ::1 counter drop
      		# Replies to connections this host opened. ICMPv4/ICMPv6 errors for those flows (unreachable,
      		# fragmentation-needed / packet-too-big for path MTU discovery, time-exceeded) arrive as related.
      		ct state established,related accept
      		# Inbound SSH.
      		tcp dport 22 accept
      		# EC2 needs: DHCPv4 server replies. The lease request is broadcast, so conntrack cannot match the reply.
      		udp sport 67 udp dport 68 accept
      		# EC2 needs: DHCPv6 server replies (IPv6-enabled subnets). The request goes to multicast ff02::1:2, so the
      		# reply is not tracked.
      		udp sport 547 udp dport 546 accept
      		# EC2 needs: IPv6 neighbour discovery (address resolution, duplicate-address detection) and router
      		# advertisements (default route). conntrack does not track these.
      		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept
      	}
      	chain forward {
      		# Not a router: nothing is forwarded.
      		type filter hook forward priority filter; policy drop;
      	}
      	chain output {
      		type filter hook output priority filter; policy drop;
      		# Loopback (local services, e.g. systemd-resolved on 127.0.0.53).
      		oif "lo" accept
      		# Replies on connections accepted inbound (SSH) and the rest of flows allowed below.
      		ct state established,related accept
      		# DNS (VPC resolver 169.254.169.253 / base+2 or any configured resolver).
      		udp dport 53 accept
      		tcp dport 53 accept
      		# NTP (Amazon Time Sync 169.254.169.123 or public pools).
      		udp dport 123 accept
      		# HTTP/HTTPS: package repositories, EC2 instance metadata (169.254.169.254, fd00:ec2::254), SSM endpoints.
      		tcp dport { 80, 443 } accept
      		# EC2 needs: DHCPv4 lease requests and renewals.
      		udp sport 68 udp dport 67 accept
      		# EC2 needs: DHCPv6 requests (IPv6-enabled subnets).
      		udp sport 546 udp dport 547 accept
      		# EC2 needs: IPv6 neighbour discovery answers/probes and router solicitation at link-up.
      		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit } accept
      	}
      }
  when: '"nftables" in ansible_facts.packages'
  tags:
    - nftables_ensure_default_deny_policy

# The SSH session running this play must survive the load. conntrack only starts tracking in this network namespace once a ruleset
# uses a ct expression; the generated nftables tasks add none, so this session has no conntrack entry yet. If the first packet seen
# after the load were outbound (this task's own result going back), it would be state new and the output chain, which has no
# source-port-22 allow, would drop it and stall the session. A transient table with a ct rule makes conntrack pick the session up
# from the packets exchanged between this task and the load; the load's `flush ruleset` removes it. Skipped once any ct rule is live.
- name: Start connection tracking before the default-deny load so the play's SSH session survives (nftables_ensure_default_deny_policy)
  ansible.builtin.shell: |
    set -euo pipefail
    if nft list ruleset | grep '[[:space:]]ct state' >/dev/null; then exit 0; fi
    nft 'add table inet stigforge_ct_prime; add chain inet stigforge_ct_prime output { type filter hook output priority 0; policy accept; }; add rule inet stigforge_ct_prime output ct state established counter'
  args:
    executable: /bin/bash
  changed_when: false
  when: '"nftables" in ansible_facts.packages'
  tags:
    - nftables_ensure_default_deny_policy

# One `nft -f` transaction (flush ruleset + include): the drop policies and the SSH allow go live together, never one without the
# other. Validated first with `nft -c`. Reports changed only when the running ruleset (stateless listing) actually differed.
- name: Load /etc/nftables.conf so the running ruleset is the default-deny one (nftables_ensure_default_deny_policy)
  ansible.builtin.shell: |
    set -euo pipefail
    nft -c -f /etc/nftables.conf
    before="$(nft -s list ruleset)"
    nft -f /etc/nftables.conf
    after="$(nft -s list ruleset)"
    if [ "$before" != "$after" ]; then echo "ruleset reloaded"; fi
  args:
    executable: /bin/bash
  register: stigforge_nftables_load
  changed_when: "'ruleset reloaded' in stigforge_nftables_load.stdout"
  when: '"nftables" in ansible_facts.packages'
  tags:
    - nftables_ensure_default_deny_policy

# audit_rules_privileged_commands (CIS 6.2.3.6, cis-l2). ubuntu-24.04:cis-l2 leg d572c5d41b14 failed it with 23 setuid/setgid binaries
# (chage, passwd, su, sudo, mount, unix_chkpwd, postdrop, ...) unaudited: SSG 0.1.82 ships only a bash fix for ubuntu2404, so the
# generator emitted nothing. The SCE check lists every file with -perm /6000 (find -xdev) on each local mount whose type is not a
# nodev filesystem and whose options carry neither noexec nor nosuid, and needs EXACTLY ONE line per binary in
# /etc/audit/rules.d/*.rules matching `-a always,exit -F path=<bin> [-F perm=x] -F auid>=1000 -F auid!=unset (-k|-F key=)<key>`;
# a missing or a duplicate rule fails. The listing below mirrors that mount selection and matching (the same regex and
# `-F path=<bin>\b` count), and skips any binary already ruled outside this block (the generated chacl/setfacl/chcon/kmod/usermod
# tasks also write privileged.rules), so nothing is duplicated. It runs at the end of the supplement, after every package install
# in the play, so binaries those installs add are covered. A managed block keeps the other lines of privileged.rules intact.
- name: List setuid/setgid binaries without a privileged-command audit rule (audit_rules_privileged_commands)
  ansible.builtin.shell: |
    set -euo pipefail
    shopt -s nullglob
    regex='^[\s]*-a always,exit (?:-F path=([\S]+))+(?: -F perm=x)? -F auid>=1000 -F auid!=(?:4294967295|unset|-1)[\s]+(?:-k[\s]+|-F[\s]+key=)[\S]+[\s]*$'
    ruled=$(for f in /etc/audit/rules.d/*.rules; do
              awk '/^# BEGIN STIGFORGE audit_rules_privileged_commands$/ {skip=1; next}
                   /^# END STIGFORGE audit_rules_privileged_commands$/ {skip=0; next}
                   !skip' "$f"
            done | grep -P -- "$regex" || true)
    filter_nodev=$(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)
    readarray -t partitions < <(findmnt -n -l -k -it "${filter_nodev}" | grep -Pv "noexec|nosuid|/proc($|/.*$)" | awk '{ print $1 }')
    for partition in "${partitions[@]}"; do
      while IFS= read -r -d $'\0' bin; do
        n=$(grep -Pc -- "-F path=${bin}\b" <<< "${ruled}" || true)
        if [ "${n:-0}" -eq 0 ]; then printf '%s\n' "${bin}"; fi
      done < <(find "${partition}" -xdev -type f -perm /6000 -print0)
    done | LC_ALL=C sort -u
  args:
    executable: /bin/bash
  register: stigforge_privileged_unruled
  changed_when: false
  tags:
    - audit_rules_privileged_commands

- name: Audit every setuid/setgid binary once in /etc/audit/rules.d/privileged.rules (audit_rules_privileged_commands)
  ansible.builtin.blockinfile:
    path: /etc/audit/rules.d/privileged.rules
    create: true
    owner: root
    group: root
    mode: "0600"  # what the generated audit_rules_execution_* tasks set on this file; a different mode would flap on every run
    marker: "# {mark} STIGFORGE audit_rules_privileged_commands"
    block: |
      {% for bin in stigforge_privileged_unruled.stdout_lines %}
      -a always,exit -F path={{ bin }} -F perm=x -F auid>=1000 -F auid!=unset -k privileged
      {% endfor %}
  register: stigforge_privileged_rules
  tags:
    - audit_rules_privileged_commands

# The SCE reads the rules.d files; loading them makes the running audit config match. Skipped when the loaded config is already
# immutable (-e 2, audit_rules_immutable): the kernel refuses changes until reboot, and the next boot loads these files.
- name: Load the audit rules after the privileged-command rules changed (audit_rules_privileged_commands)
  ansible.builtin.shell: |
    set -euo pipefail
    if auditctl -s | grep -q '^enabled 2'; then echo "immutable, loaded at next boot"; exit 0; fi
    augenrules --load
  args:
    executable: /bin/bash
  register: stigforge_privileged_load
  changed_when: "'immutable' not in stigforge_privileged_load.stdout"
  when: stigforge_privileged_rules is changed
  tags:
    - audit_rules_privileged_commands

- name: Enforce AppArmor profiles of installed programs, disable those of absent ones (all_apparmor_profiles_enforced)
  ansible.builtin.shell: |
    set -euo pipefail
    [ -r /sys/kernel/security/apparmor/profiles ] || { echo "apparmor not active"; exit 0; }
    python3 - <<'PY'
    import glob, os, re, subprocess
    D = "/etc/apparmor.d"
    DIS = D + "/disable"
    KERNEL = "/sys/kernel/security/apparmor/profiles"
    HDR = re.compile(r'^\s*(?:profile\s+(?P<name>"[^"]+"|\S+)(?:\s+(?P<attach>"[^"]+"|[/@]\S*))?|(?P<path>"/[^"]+"|/\S+))'
                     r'\s*(?:flags\s*=\s*\((?P<flags>[^)]*)\))?\s*\{')
    VAR = re.compile(r'^\s*@\{(\w+)\}\s*\+?=\s*(.+?)\s*$')
    NOT_ENFORCE = {"complain", "unconfined", "kill"}
    changed = []

    def loaded():
        modes = {}
        with open(KERNEL) as fh:
            for line in fh:
                m = re.match(r'^(.*) \((\w+)\)$', line.rstrip("\n"))
                if m and "//" not in m.group(1):
                    modes[m.group(1)] = m.group(2)
        return modes

    def expand(p):
        m = re.search(r'\{([^{}]*)\}', p)
        if not m:
            return [p]
        return [x for alt in m.group(1).split(",") for x in expand(p[:m.start()] + alt + p[m.end():])]

    def resolve(p, var):
        for _ in range(5):
            q = re.sub(r'@\{(\w+)\}', lambda m: "{" + ",".join(var[m.group(1)]) + "}" if m.group(1) in var else "*", p)
            if q == p:
                break
            p = q
        return p

    def top_profiles(text):
        var = {"multiarch": ["*-linux-gnu*"], "HOME": ["/home/*", "/root"]}
        tops, depth = [], 0
        for raw in text.splitlines():
            line = "" if raw.lstrip().startswith("#") else raw.split("#", 1)[0]
            if depth == 0:
                v = VAR.match(line)
                if v:
                    var.setdefault(v.group(1), []).extend(x.strip('"') for x in v.group(2).split())
                h = HDR.match(line)
                if h:
                    attach = h.group("attach") or h.group("path")
                    tops.append(((h.group("name") or attach).strip('"'), attach.strip('"') if attach else None))
            depth += line.count("{") - line.count("}")
        return tops, var

    def installed(tops, var):
        if any(a is None for _, a in tops):
            return True  # attaches by name (systemd AppArmorProfile=, aa-exec, change_profile): keep it, enforced
        return any(glob.glob(p, recursive=True) for _, a in tops for p in expand(resolve(a, var)))

    def strip_flags(m):
        kept = [f for f in re.split(r'[\s,]+', m.group(1).strip()) if f and f not in NOT_ENFORCE]
        return (" flags=(" + ", ".join(kept) + ")") if kept else ""

    os.makedirs(DIS, exist_ok=True)
    modes = loaded()
    defined = set()
    for f in sorted(glob.glob(D + "/*")):
        if not os.path.isfile(f) or os.path.islink(f):
            continue
        base = os.path.basename(f)
        text = open(f, errors="replace").read()
        tops, var = top_profiles(text)
        if not tops:
            continue
        names = [n for n, _ in tops]
        if os.path.lexists(os.path.join(DIS, base)) or not installed(tops, var):
            if not os.path.lexists(os.path.join(DIS, base)):
                os.symlink(f, os.path.join(DIS, base))
                changed.append("disabled " + base)
            if any(n in modes for n in names):
                subprocess.run(["apparmor_parser", "-R", f], check=True, stdout=subprocess.DEVNULL)
                changed.append("unloaded " + base)
            continue
        defined.update(names)
        new = re.sub(r'\s*\bflags\s*=\s*\(([^)]*)\)', strip_flags, text)
        fc = os.path.join(D, "force-complain", base)
        if os.path.lexists(fc):
            os.unlink(fc)
            changed.append("force-complain removed " + base)
        if new != text:
            with open(f, "w") as fh:
                fh.write(new)
            changed.append("enforce flags " + base)
        if new != text or any(modes.get(n) != "enforce" for n in names):
            subprocess.run(["apparmor_parser", "-r", f], check=True, stdout=subprocess.DEVNULL)
            changed.append("enforced " + base)
    for name, mode in loaded().items():
        if mode != "enforce" and name not in defined:
            with open("/sys/kernel/security/apparmor/.remove", "w") as fh:
                fh.write(name)
            changed.append("removed " + name)
    left = [f"{n} ({m})" for n, m in loaded().items() if m != "enforce"]
    print("changed: " + "; ".join(changed) if changed else "unchanged")
    if left:
        print("still not enforcing: " + ", ".join(left))
    PY
  args:
    executable: /bin/bash
  register: stigforge_apparmor_enforced
  changed_when: "'changed:' in stigforge_apparmor_enforced.stdout"
  when: '"apparmor" in ansible_facts.packages'
  tags:
    - all_apparmor_profiles_enforced
